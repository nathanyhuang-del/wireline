backend:
  name: git-gateway
  branch: main

# Saving creates a draft (a branch + pull request) instead of publishing straight
# away. Netlify builds a preview of each draft, and the editor gets a link to it.
# Nothing reaches the live site until someone clicks Publish.
publish_mode: editorial_workflow

# Collapse a draft's commits into one when it is published, so the history stays
# readable instead of filling up with merge commits.
squash_merges: true

# Uncomment once the real domain is pointed at Netlify - it adds preview links
# for content that is already published.
# site_url: "https://www.wirelineengineering.com.au"

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------------------------------------------------------------- Homepage
  - name: "home"
    label: "Homepage"
    preview_path: "index.html"
    files:
      - label: "Homepage Content"
        name: "homepage"
        file: "content/home.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Button 1 Text", name: "button1", widget: "string" }
              - { label: "Button 2 Text", name: "button2", widget: "string" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Text"
                name: "text"
                widget: "text"
                hint: "Basic HTML is allowed, e.g. <br> for a line break and <strong>...</strong> for bold."
              - label: "Images"
                name: "images"
                widget: "list"
                max: 4
                hint: "Up to 4 images shown beside the About text."
                field: { label: "Image", name: "image", widget: "image" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Footer Text", name: "text", widget: "string" }

  # ------------------------------------------------------------ Products page
  - name: "products_page"
    label: "Products Page"
    preview_path: "products.html"
    files:
      - label: "Products Page Text"
        name: "products_page_text"
        file: "content/products-page.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }

          - label: "Wireless Depth Tracker Category"
            name: "wdt"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Wireline Winches Category"
            name: "winch"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Booms & Snatch Blocks Category"
            name: "boom"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  # ----------------------------------------------------------------- Products
  - name: "products"
    label: "Products"
    preview_path: "products.html"
    files:
      - label: "Products List"
        name: "products_list"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Short unique code, lowercase with dashes (e.g. we1500). This becomes the product's web address and cannot clash with another product."
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                hint: "Which section of the Products page this appears under."
                options:
                  - { label: "Wireless Depth Tracker", value: "wdt" }
                  - { label: "Wireline Winch", value: "winch" }
                  - { label: "Boom & Snatch Block", value: "boom" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Specifications"
                name: "specs"
                widget: "list"
                required: false
                label_singular: "Specification"
                field: { label: "Spec", name: "spec", widget: "string" }
              - label: "Key Features"
                name: "keyFeatures"
                widget: "list"
                required: false
                label_singular: "Feature"
                field: { label: "Feature", name: "feature", widget: "string" }

  # ------------------------------------------------------------ Services page
  - name: "services_page"
    label: "Services Page"
    preview_path: "services.html"
    files:
      - label: "Services Page Text"
        name: "services_page_text"
        file: "content/services-page.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Contact Heading", name: "contactHeading", widget: "string" }
          - { label: "Contact Text", name: "contactText", widget: "text" }
          - { label: "Contact Button Text", name: "contactButton", widget: "string" }

  # ----------------------------------------------------------------- Services
  - name: "services"
    label: "Services"
    preview_path: "services.html"
    files:
      - label: "Services List"
        name: "services_list"
        file: "content/services.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            label_singular: "Service"
            summary: "{{fields.title}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Short unique code, lowercase with dashes (e.g. winch-spooling). This becomes the service's web address and cannot clash with another service."
              - { label: "Title", name: "title", widget: "string" }
              - label: "Short Description"
                name: "homepageDescription"
                widget: "text"
                hint: "Shown in the summary list on the Services page."
              - label: "Full Description"
                name: "description"
                widget: "text"
                hint: "Shown on this service's own page."
              - { label: "Image", name: "image", widget: "image" }

  # ---------------------------------------------------------------- Downloads
  - name: "downloads"
    label: "Downloads Page"
    preview_path: "downloads.html"
    media_folder: "/downloads"
    public_folder: "/downloads"
    files:
      - label: "Downloads Page"
        name: "downloads_page"
        file: "content/downloads.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }

          - label: "Download Sections"
            name: "sections"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Section Heading", name: "heading", widget: "string" }
              - label: "Files"
                name: "items"
                widget: "list"
                label_singular: "File"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    default: "pdf"
                    hint: "Colour and symbol shown next to this download."
                    options:
                      - { label: "PDF document (red)", value: "pdf" }
                      - { label: "Windows program (blue)", value: "windows" }
                      - { label: "Android app (green)", value: "android" }
                      - { label: "Generic file (grey)", value: "file" }
                  - label: "File"
                    name: "file"
                    widget: "file"
                    hint: "Upload the file to download, or choose one already uploaded."
                  - label: "Button Text"
                    name: "buttonText"
                    widget: "string"
                    default: "Download"
                    hint: "Text on the download button, e.g. Download PDF or Download v1.0.6"

          - { label: "Support Heading", name: "supportHeading", widget: "string" }
          - { label: "Support Text", name: "supportText", widget: "text" }
          - { label: "Support Button Text", name: "supportButton", widget: "string" }
