<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Services - Wireline Engineering</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar"></div>
    <nav class="navbar">
        <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo">
        <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span><span></span><span></span>
        </button>
        <div class="navbar-options" id="nav-menu">
            <a href="index.html" id="home">Home</a>
            <a href="products.html" id="products">Products</a>
            <a href="services.html" id="services">Services</a>
            <a href="downloads.html" id="downloads">Downloads</a>
            <a href="contact.html" id="contact">Contact Us</a>
        </div>
    </nav>

    <main>
        <div class="services-page">
            <h1 id="services-page-title"></h1>
            <div id="services-sections"></div>
            <div class="service-section">
                <h3 id="services-contact-heading"></h3>
                <p id="services-contact-text"></p>
                <a href="contact.html" class="service-learn-more-btn" id="services-contact-button"></a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo" class="footer-logo">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="downloads.html">Downloads</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-info">
                &copy; 2025 Wireline Engineering. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

    <!-- CMS content loader -->
    <script>
      Promise.all([
        fetch("/content/services-page.json").then(res => res.json()),
        fetch("/content/services.json").then(res => res.json())
      ]).then(([page, data]) => {
        document.getElementById("services-page-title").innerText = page.title;
        document.getElementById("services-contact-heading").innerText = page.contactHeading;
        document.getElementById("services-contact-text").innerText = page.contactText;
        document.getElementById("services-contact-button").innerText = page.contactButton;

        const container = document.getElementById("services-sections");
        (data.services || []).forEach(service => {
          const section = document.createElement("div");
          section.className = "service-section";

          const heading = document.createElement("h2");
          heading.textContent = service.title;

          const desc = document.createElement("p");
          desc.textContent = service.homepageDescription;

          const link = document.createElement("a");
          link.href = serviceUrl(service);
          link.className = "service-learn-more-btn";
          link.textContent = "Learn More";

          section.appendChild(heading);
          section.appendChild(desc);
          section.appendChild(link);
          container.appendChild(section);
        });
      });
    </script>
</body>
</html>
