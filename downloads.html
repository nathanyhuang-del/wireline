<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downloads - Wireline Engineering</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar"></div>
    <nav class="navbar">
        <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo">
        <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span><span></span><span></span>
        </button>
        <div class="navbar-options" id="nav-menu">
            <a href="index.html" id="home">Home</a>
            <a href="products.html" id="products">Products</a>
            <a href="services.html" id="services">Services</a>
            <a href="downloads.html" id="downloads">Downloads</a>
            <a href="contact.html" id="contact">Contact Us</a>
        </div>
    </nav>

    <main>
        <div class="downloads-page">
            <h1 id="downloads-title"></h1>
            <p id="downloads-subtitle"></p>

            <div id="downloads-sections"></div>

            <div class="downloads-section">
                <h3 id="downloads-support-heading"></h3>
                <p id="downloads-support-text"></p>
                <a href="contact.html" class="download-btn" id="downloads-support-button"></a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo" class="footer-logo">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="downloads.html">Downloads</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-info">
                &copy; 2025 Wireline Engineering. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

    <!-- CMS content loader -->
    <script>
      const DOWNLOAD_ICONS = {
        windows: "M3 12V6.75L9 5.43V11.91L3 12M20 3V11.75L10 11.9V5.21L20 3M3 13L9 13.09V19.9L3 18.75V13M20 13.25V22L10 20.09V13.1L20 13.25Z",
        android: "M17.5 15.5C17.5 16.88 16.38 18 15 18S12.5 16.88 12.5 15.5 13.62 13 15 13 17.5 14.12 17.5 15.5M8.5 15.5C8.5 16.88 7.38 18 6 18S3.5 16.88 3.5 15.5 4.62 13 6 13 8.5 14.12 8.5 15.5M14.97 11.5C13.25 9.1 11.73 8.1 11.73 8.1S10.21 9.1 8.5 11.5H14.97M15 7.5L16.97 1C17.16.6 17.63.44 18.03.63S18.56 1.37 18.37 1.77L16.5 7.5H15M6 7.5H4.5L2.63 1.77C2.44 1.37 2.6.9 3 .63S3.84.6 4.03 1L6 7.5M12 2.25C12 1 10.96 0 9.75 0S7.5 1 7.5 2.25 8.54 4.5 9.75 4.5 12 3.5 12 2.25Z",
        pdf: "M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z",
        file: "M13,9V3.5L18.5,9M6,2C4.89,2 4,2.89 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2H6Z"
      };
      const SVG_NS = "http://www.w3.org/2000/svg";

      function buildDownloadIcon(iconName) {
        const key = DOWNLOAD_ICONS[iconName] ? iconName : "file";
        const wrapper = document.createElement("div");
        wrapper.className = "download-icon " + key + "-icon";

        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "currentColor");

        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", DOWNLOAD_ICONS[key]);

        svg.appendChild(path);
        wrapper.appendChild(svg);
        return wrapper;
      }

      function buildDownloadItem(item) {
        const row = document.createElement("div");
        row.className = "download-item";
        row.appendChild(buildDownloadIcon(item.icon));

        const info = document.createElement("div");
        info.className = "download-info";

        const title = document.createElement("h3");
        title.textContent = item.title;
        info.appendChild(title);

        const desc = document.createElement("p");
        desc.textContent = item.description || "";
        info.appendChild(desc);

        if (item.file) {
          const link = document.createElement("a");
          link.href = item.file;
          link.className = "download-btn";
          link.setAttribute("download", "");
          link.textContent = item.buttonText || "Download";
          info.appendChild(link);
        }

        row.appendChild(info);
        return row;
      }

      fetch("/content/downloads.json")
        .then(res => res.json())
        .then(data => {
          document.getElementById("downloads-title").innerText = data.title;
          document.getElementById("downloads-subtitle").innerText = data.subtitle || "";
          document.getElementById("downloads-support-heading").innerText = data.supportHeading || "";
          document.getElementById("downloads-support-text").innerText = data.supportText || "";
          document.getElementById("downloads-support-button").innerText = data.supportButton || "Contact Us";

          const container = document.getElementById("downloads-sections");
          (data.sections || []).forEach(section => {
            const block = document.createElement("div");
            block.className = "downloads-section";

            const heading = document.createElement("h2");
            heading.textContent = section.heading;
            block.appendChild(heading);

            (section.items || []).forEach(item => block.appendChild(buildDownloadItem(item)));
            container.appendChild(block);
          });
        });
    </script>
</body>
</html>
