<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Wireline Engineering</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar"></div>
    <nav class="navbar">
        <img src="images/logo/logo with text white.png">
        <div class="navbar-options">
            <a href="index.html" id="home">Home</a>
            <a href="products.html" id="products">Products</a>
            <a href="services.html" id="services">Services</a>
            <a href="downloads.html" id="downloads">Downloads</a>
            <a href="contact.html" id="contact">Contact Us</a>
        </div>
    </nav>

    <div class="slideshow-overlay">
        <h1 id="hero-title"></h1>
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-buttons">
            <a href="products.html" class="home-product-button" id="hero-btn-1"></a>
            <a href="services.html" class="home-product-button secondary" id="hero-btn-2"></a>
        </div>
    </div>
    <div class="slideshow">
        <!-- slideshow images will be injected by script.js -->
    </div>

    <div class="what-we-do">
        <h2 id="about-title"></h2>
        <div class="what-we-do-content">
            <p id="about-text"></p>
            <div class="what-we-do-images">
                <img id="about-img-1">
                <img id="about-img-2">
                <img id="about-img-3">
                <img id="about-img-4">
            </div>
        </div>
    </div>

    <div class="home-products">
        <div class="home-product-text">
            <h2 id="products-title"></h2>
            <p id="products-description"></p>
        </div>
        <div class="product-carousel">
            <button class="carousel-arrow left">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <line x1="18" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <polyline points="12,6 6,12 12,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="carousel-track"></div>
            <button class="carousel-arrow right">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <polyline points="12,6 18,12 12,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <a href="products.html" class="see-all-products-btn" id="products-link"></a>
    </div>

    <div class="services">
        <h2 class="services-title" id="services-title"></h2>
        <div class="services-options" id="services-container">
            <!-- Service cards still generated by script.js -->
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo" class="footer-logo">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="downloads.html">Downloads</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-info" id="footer-text"></div>
        </div>
    </footer>

    <script src="script.js"></script>

    <!-- CMS content loader -->
    <script>
      fetch("/content/home.json")
        .then(res => res.json())
        .then(data => {
          document.getElementById("hero-title").innerText = data.hero.title;
          document.getElementById("hero-subtitle").innerText = data.hero.subtitle;
          document.getElementById("hero-btn-1").innerText = data.hero.button1;
          document.getElementById("hero-btn-2").innerText = data.hero.button2;

          document.getElementById("about-title").innerText = data.about.title;
          document.getElementById("about-text").innerHTML = data.about.text;

          document.getElementById("about-img-1").src = data.about.images[0];
          document.getElementById("about-img-2").src = data.about.images[1];
          document.getElementById("about-img-3").src = data.about.images[2];
          document.getElementById("about-img-4").src = data.about.images[3];

          document.getElementById("products-title").innerText = data.products.title;
          document.getElementById("products-description").innerText = data.products.description;
          document.getElementById("products-link").innerText = data.products.linkText;

          document.getElementById("services-title").innerText = data.services.title;
          document.getElementById("footer-text").innerText = data.footer.text;
        });
    </script>
</body>
</html>
