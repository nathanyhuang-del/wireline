<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <img src="images/logo/logo with text white.png">
        <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span><span></span><span></span>
        </button>
        <div class="navbar-options" id="nav-menu">
            <a href="index.html" id="home">Home</a>
            <a href="products.html" id="products">Products</a>
            <a href="services.html" id="services">Services</a>
            <a href="downloads.html" id="downloads">Downloads</a>
            <a href="contact.html" id="contact">Contact Us</a>
        </div>
    </nav>

    <div class="products-page">
        <h1 id="products-page-title"></h1>
        <div class="product-showcase">

            <div class="wdt">
                <h2 id="wdt-heading"></h2>
                <p id="wdt-description"></p>
                <div class="product-grid" id="wdt-products"></div>
            </div>

            <div class="wireline-winches">
                <h2 id="winch-heading"></h2>
                <p id="winch-description"></p>
                <div class="product-grid" id="winch-product-tiles"></div>
            </div>

            <div class="booms-sheaves">
                <h2 id="boom-heading"></h2>
                <p id="boom-description"></p>
                <div class="product-grid" id="boom-products"></div>
            </div>

        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/logo/logo with text white.png" alt="Wireline Engineering Logo" class="footer-logo">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="downloads.html">Downloads</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-info">
                &copy; 2025 Wireline Engineering. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

    <!-- CMS content loader -->
    <script>
      fetch("/content/products-page.json")
        .then(res => res.json())
        .then(data => {
          document.getElementById("products-page-title").innerText = data.title;
          ["wdt", "winch", "boom"].forEach(key => {
            const section = data[key] || {};
            document.getElementById(key + "-heading").innerText = section.heading || "";
            document.getElementById(key + "-description").innerText = section.description || "";
          });
        });
    </script>
</body>
</html>
